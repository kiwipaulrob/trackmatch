[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackmatch"
version = "0.1.0"
description = "Probabilistic stream-to-local music track matcher"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.optional-dependencies]
speed = ["rapidfuzz>=3.0"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
